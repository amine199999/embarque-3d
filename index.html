<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<meta charset="utf-8">
<title>Embarqué 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: workbench — a 3D stage on the left, a lesson panel on the right, comparison table below */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#14202a; --muted:#5a6a77; --line:#d4dce2;
  --accent:#c8641f; --accent-soft:#f6e3d4; --stage-a:#f7f9fa; --stage-b:#dfe6eb;
  --ok:#1f7a4d; --bad:#b3362c; --code-bg:#f3f5f7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --panel:#141c22; --fg:#e4ebf0; --muted:#8c9ba7; --line:#26323b;
  --accent:#ef8a3e; --accent-soft:#3a2617; --stage-a:#1a242b; --stage-b:#0b1014;
  --ok:#4cc38a; --bad:#ef6b5f; --code-bg:#0f161b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --panel:#141c22; --fg:#e4ebf0; --muted:#8c9ba7; --line:#26323b;
  --accent:#ef8a3e; --accent-soft:#3a2617; --stage-a:#1a242b; --stage-b:#0b1014;
  --ok:#4cc38a; --bad:#ef6b5f; --code-bg:#0f161b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1320px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;font-style:normal;font-size:13px;font-family:var(--f-mono)}
.brand span{color:var(--accent)}
nav.boards{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px;scrollbar-width:thin}
nav.boards button{flex:none;font:500 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
nav.boards button:hover{border-color:var(--accent)}
nav.boards button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{position:sticky;top:12px;height:min(78vh,720px);min-height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b))}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,34px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hud p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dims{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.tools button{font:500 12px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.views{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:2}
.views button{min-width:42px;height:32px;display:grid;place-items:center;padding:0 6px;font:600 11px var(--f-body);color:var(--fg);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;cursor:pointer;backdrop-filter:blur(4px)}
.views button:hover{border-color:var(--accent)}
.views button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.views .vsep{height:6px}
.views button[hidden]{display:none}
.stage.max{position:fixed;inset:0;z-index:60;height:100vh;height:100dvh;border-radius:0;border:0}
body.stage-max{overflow:hidden}
.hint{position:absolute;right:12px;bottom:58px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font:600 12px var(--f-body);padding:5px 9px;border-radius:6px;white-space:nowrap;margin-top:-14px}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:var(--fg)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;font:600 13px var(--f-body);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:18px}
.lead{margin:0 0 14px;color:var(--fg)}
.eyebrow{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.detail{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;background:var(--bg)}
.detail h3{font-family:var(--f-display);font-size:20px;margin:6px 0 6px;line-height:1.15}
.detail p{margin:0 0 8px}
.tip{border-left:3px solid var(--accent);padding:4px 0 4px 10px;color:var(--muted);font-size:14px;margin:8px 0 0}
.cat{display:inline-block;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.parts button{text-align:left;font:500 13px var(--f-body);background:none;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.parts button small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.parts button:hover{border-color:var(--accent)}
.parts button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.spec dt{color:var(--muted);font-size:13px}
dl.spec dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td code{font-family:var(--f-mono);font-size:12px;background:var(--code-bg);padding:1px 5px;border-radius:4px;white-space:nowrap}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font:13px/1.6 var(--f-mono)}
.codebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.btn{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.q{margin-bottom:18px}
.q h4{margin:0 0 8px;font-size:15px}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:left;font:14px var(--f-body);color:var(--fg);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.q .opts button.right{border-color:var(--ok);color:var(--ok);font-weight:600}
.q .opts button.wrong{border-color:var(--bad);color:var(--bad)}
.q .why{font-size:13px;color:var(--muted);margin:6px 0 0}
.score{font-family:var(--f-display);font-weight:700;font-size:18px}

.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1 1 auto;font:600 12px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wiring{margin:0 0 14px;padding-left:18px;font-size:14px}
.wiring li{margin-bottom:3px}
.wiring b{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form select,.form input{font:500 14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%}
.runbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.runbar .meta{font:12px var(--f-mono);color:var(--muted)}
.press{user-select:none;touch-action:none}
.press.on{background:var(--accent);border-color:var(--accent);color:#fff}
.trace{width:100%;height:84px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);margin-bottom:12px}
.lines{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:10px 0;overflow-x:auto;font:12.5px/1.6 var(--f-mono)}
.lines div{padding:0 14px;white-space:pre;border-left:3px solid transparent}
.lines div.hl{background:var(--accent-soft);border-left-color:var(--accent)}
.serial{height:130px;overflow-y:auto;background:#0b0f12;color:#9fe6b8;border-radius:10px;padding:10px 12px;font:12px/1.5 var(--f-mono);margin-top:12px;white-space:pre-wrap}
.serial:empty::before{content:"Les messages du programme s'afficheront ici.";color:#5f7a6a}

section.compare{margin-top:36px}
section.compare h2{font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);margin:0 0 4px;letter-spacing:-.01em}
section.compare > p{color:var(--muted);margin:0 0 14px;max-width:65ch}
section.compare .tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px}
section.compare tr[data-id]{cursor:pointer}
section.compare tr[data-id]:hover td{background:var(--accent-soft)}
section.compare td:first-child{font-weight:600;white-space:nowrap}


/* ---- Simulateur (inspiré de Wokwi) ---- */
.simfab{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;font:700 13px var(--f-body);background:#1f9d55;color:#fff;border:0;border-radius:999px;padding:9px 16px 9px 12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.simfab.on{background:#c23b2f}
.simfab:hover{filter:brightness(1.08)}
.wk{display:flex;flex-direction:column;gap:12px}
.wk-bar{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.wk-ic{display:grid;place-items:center;width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.wk-ic:disabled{opacity:.4;cursor:default}
.wk-ic[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.wk-go{background:#1f9d55;border-color:#1f9d55;color:#fff}
.wk-clock{display:flex;align-items:baseline;gap:6px;margin-left:6px;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.wk-clock small{font-size:11px;color:var(--muted)}
.wk-state{flex:1;text-align:right;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk-state[data-s="run"]{color:var(--ok)}
.wk-state[data-s="pause"]{color:var(--accent)}
.wk-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wk-head label,.wk-pins label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.wk select,.wk input[type=text],.wk-send input{font:500 13px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
.wk-fixed{font:600 13px var(--f-mono);color:var(--fg);padding:6px 0}
.wk-desc{margin:0;color:var(--muted);font-size:14px}
.wk-sec{display:flex;flex-direction:column;gap:8px}
.wk-sech{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wk-comps{display:flex;flex-direction:column;gap:6px}
.wk-comp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg)}
.wk-ct{display:flex;align-items:baseline;gap:8px}
.wk-ct b{font-size:14px}
.wk-ct small{color:var(--muted);font:11px var(--f-mono)}
.wk-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.wk-x:hover{color:var(--bad)}
.wk-pins{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.wk-pins label{flex-direction:row;align-items:center;gap:6px}
.wk .wk-wc{width:20px;height:20px;padding:0;border-radius:5px;border:2px solid var(--line);background:var(--c);color:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;flex:none}
.wk .wk-wc option{color:var(--fg);background:var(--panel)}
.wk-cg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-basis:100%}
.wk-cg > b{font-size:13px;flex-basis:100%}
.wk-tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wk-exb{margin-left:8px;padding:3px 8px;font-size:11px}
.wk-place{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.wk-place span{font-size:12px;color:var(--muted);margin-right:2px}
.wk-sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.wk-warn{color:var(--bad);font-style:normal;font-size:11px;font-weight:600}
.wk-ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:9px}
.wk-pot{display:flex;align-items:center;gap:8px;font-size:13px}
.wk-pot input{accent-color:var(--accent);width:140px}
.wk-pot output{font:12px var(--f-mono);min-width:40px}
.wk-hint{font-size:12px;color:var(--muted)}
.wk-edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-file{font:600 12px var(--f-mono);padding:5px 10px;border:1px solid var(--line);border-bottom:2px solid var(--accent);border-radius:7px 7px 0 0;background:var(--bg)}
.wk-mod{font:11px var(--f-mono);color:var(--accent)}
.wk-ed{position:relative;display:flex;height:360px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);overflow:hidden;font:12.5px/20px var(--f-mono)}
.wk-gut{flex:none;width:40px;padding:10px 0;text-align:right;color:var(--muted);opacity:.7;user-select:none;border-right:1px solid var(--line);will-change:transform}
.wk-gut div{padding-right:8px;height:20px}
.wk-gut div.err{color:#fff;background:var(--bad);opacity:1}
.wk-area{position:relative;flex:1;min-width:0;overflow:hidden}
.wk-hl,.wk-area textarea{position:absolute;inset:0;margin:0;padding:10px 12px;font:inherit;white-space:pre;tab-size:4;border:0;background:none;overflow:hidden}
.wk-hl{color:var(--fg);pointer-events:none;inset:0 auto auto 0;min-width:100%;will-change:transform}
.wk-area textarea{color:transparent;caret-color:var(--fg);resize:none;outline:none;overflow:auto;z-index:1}
.wk-area textarea::selection{background:rgba(239,138,62,.3);color:transparent}
.wk-errl{position:absolute;left:0;right:0;height:20px;background:rgba(179,54,44,.16);border-left:3px solid var(--bad);pointer-events:none}
.tc{color:#6a7f8f;font-style:italic}.ts{color:#0f7b4a}.tp{color:#9a5b12}.tn{color:#b5541a}.tk{color:#2752c8;font-weight:600}.tb{color:#8a3fb8}.tf{color:#0e6f86}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tc{color:#7d8f9c}:root:not([data-theme="light"]) .ts{color:#7fd6a2}:root:not([data-theme="light"]) .tp{color:#e0b26a}:root:not([data-theme="light"]) .tn{color:#f29b63}:root:not([data-theme="light"]) .tk{color:#8db2ff}:root:not([data-theme="light"]) .tb{color:#d4a1f5}:root:not([data-theme="light"]) .tf{color:#7fd3e6}}
:root[data-theme="dark"] .tc{color:#7d8f9c}:root[data-theme="dark"] .ts{color:#7fd6a2}:root[data-theme="dark"] .tp{color:#e0b26a}:root[data-theme="dark"] .tn{color:#f29b63}:root[data-theme="dark"] .tk{color:#8db2ff}:root[data-theme="dark"] .tb{color:#d4a1f5}:root[data-theme="dark"] .tf{color:#7fd3e6}
.wk-console{max-height:120px;overflow-y:auto;border-radius:8px;font:12px/1.5 var(--f-mono)}
.wk-m{padding:4px 10px;border-left:3px solid var(--line);background:var(--bg);margin-bottom:2px}
.wk-m.ok{border-color:var(--ok)}.wk-m.warn{border-color:var(--accent)}.wk-m.err{border-color:var(--bad);color:var(--bad)}
.wk-serial{border-radius:10px;overflow:hidden;border:1px solid #1d2a24;background:#0b0f12}
.wk-serh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#141b17;color:#cfe8d8;font:600 12px var(--f-body)}
.wk-serh small{font:11px var(--f-mono);color:#7d9a89}
.wk-serh button{font:600 11px var(--f-body);background:none;border:1px solid #2b3a32;color:#cfe8d8;border-radius:6px;padding:3px 8px;cursor:pointer}
.wk-serial .serial{margin:0;border-radius:0;height:150px}
.wk-send{display:flex;border-top:1px solid #1d2a24}
.wk-send input{flex:1;background:#0b0f12;border:0;color:#d6f5e2;border-radius:0;padding:8px 10px;font-family:var(--f-mono)}
.wk-send button{font:600 12px var(--f-body);background:#1f9d55;color:#fff;border:0;padding:0 14px;cursor:pointer}

@media (max-width:1180px){ .hint{display:none} }
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .stage{position:relative;top:0;height:56vh}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i>3D</i>Embarqué<span>.</span></div>
    <nav class="boards" id="boardNav" aria-label="Cartes"></nav>
  </header>

  <div class="app">
    <div class="stage" id="stage">
      <div class="hud">
        <div><h1 id="bName">ESP32</h1><p id="bTag"></p></div>
        <div class="dims" id="bDims"></div>
      </div>
      <div class="tools">
        <button id="btnAssemble" type="button">Remonter la carte</button>
        <button id="btnExplode" type="button" aria-pressed="false">Vue éclatée</button>
        <button id="btnSpin" type="button" aria-pressed="false">Rotation auto</button>
      </div>
      <div class="views" id="views" role="toolbar" aria-label="Caméra">
        <button type="button" data-view="fit" title="Recentrer (R)" aria-label="Recentrer"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
        <button type="button" data-view="iso" title="Vue 3D (V)" aria-pressed="false">3D</button>
        <button type="button" data-view="top" title="Vue de dessus (T)" aria-pressed="false">Dessus</button>
        <button type="button" data-view="front" title="Vue de face (F)" aria-pressed="false">Face</button>

  code:{lang:"Arduino (C++)",src:`#include <WiFi.h>

const char* SSID = "MonReseau";
const char* PASS = "motdepasse";

void setup() {
  Serial.begin(115200);
  pinMode(2, OUTPUT);              // LED sur la plupart des clones
  WiFi.begin(SSID, PASS);
  while (WiFi.status() != WL_CONNECTED) {
    digitalWrite(2, !digitalRead(2));
    delay(250);
  }
  Serial.print("Connecté, IP : ");
  Serial.println(WiFi.localIP());
}

void loop() {
  int lux = analogRead(34);        // 0 à 4095 (12 bits)
  Serial.printf("Lumière : %d\\n", lux);
  delay(1000);
}`},

  Serial.begin(9600);
  analogReference(INTERNAL);     // référence 1,1 V

  delay(1000);
}`},

  serveur.begin();
}

// Workbench: green self-healing cutting mat, 1 cm grid (1 unit = 10 mm), bolder line every 5 cm
const GROUND_Y = -1.04;
const matTex = (function(){
  const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d");
  g.fillStyle = "#24493b"; g.fillRect(0,0,1024,1024);
  const img = g.getImageData(0,0,1024,1024), px = img.data;
  for(let i=0;i<px.length;i+=4){ const n = (Math.random()-.5)*10; px[i]+=n; px[i+1]+=n; px[i+2]+=n; }
  g.putImageData(img,0,0);
  for(let i=0;i<=20;i++){
    const p = i*1024/20, bold = i%5===0;
    g.strokeStyle = bold ? "rgba(214,232,205,0.55)" : "rgba(190,220,190,0.28)"; g.lineWidth = bold ? 2.4 : 1.2;
    g.beginPath(); g.moveTo(p,0); g.lineTo(p,1024); g.moveTo(0,p); g.lineTo(1024,p); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12,12); t.anisotropy = 8; return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,240), new THREE.MeshStandardMaterial({map:matTex,roughness:0.92,metalness:0}));

/* ============ MATERIALS & TEXTURES ============ */
const M = (color,o={}) => new THREE.MeshStandardMaterial(Object.assign({color,roughness:0.6,metalness:0.05},o));
const GOLD = () => M("#e6bd6a",{metalness:1,roughness:0.22});
const SILVER = () => M("#d6d9dc",{metalness:1,roughness:0.28});
const BLACK = () => M("#19191b",{roughness:0.48});

function canvasTex(w,h,draw){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"),w,h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
function labelTex(text,bg,fg,w,d){
  const W = 512, H = Math.max(64,Math.round(512*d/w));
  // laser-etched marking: several lines, first one bolder, pin-1 dimple in the corner
  const lines = String(text).split("\n");
  return canvasTex(W,H,(g)=>{
    g.fillStyle = bg; g.fillRect(0,0,W,H);
    const font = (fs,i) => `${i===0?700:500} ${fs}px "JetBrains Mono", monospace`;
    let fs = Math.min(H*0.8/(lines.length*1.25), 90);
    const widest = () => Math.max(...lines.map((l,i) => { g.font = font(fs,i); return g.measureText(l).width; }));
    while(widest() > W*0.84 && fs > 8) fs -= 1;
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
    lines.forEach((l,i) => { g.font = font(fs,i); g.fillText(l, W/2, H/2 + (i-(lines.length-1)/2)*fs*1.25); });
    g.globalAlpha = .55; g.beginPath(); g.arc(W*0.07,H*0.18,Math.min(W,H)*0.045,0,7); g.fillStyle = "rgba(0,0,0,.6)"; g.fill();
  });
}
function topBox(w,h,d,sideMat,topMap){
  const top = sideMat.clone(); top.map = topMap; top.color = new THREE.Color("#ffffff");
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[sideMat,sideMat,top,sideMat,sideMat,sideMat]);
}
function rng(seed){ let s = 0; for(const ch of seed) s = (s*31 + ch.charCodeAt(0)) >>> 0; return () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296; }
// bump=true draws the height map: copper tracks and silkscreen ink sit slightly above the varnish
function pcbTex(b, bump){
  const {w,d,color,holes=[]} = b.pcb, PX = 200, W = Math.round(w*PX), H = Math.round(d*PX), r = rng(b.id);
  return canvasTex(W,H,(g)=>{
    g.fillStyle = bump ? "#000" : color; g.fillRect(0,0,W,H);
    if(!bump){ // faint glass-weave texture under the solder mask
      const img = g.getImageData(0,0,W,H), px = img.data;
      for(let i=0;i<px.length;i+=4){ const n = (r()-.5)*7; px[i]+=n; px[i+1]+=n; px[i+2]+=n; }
      g.putImageData(img,0,0);
    }
    g.lineCap = "round"; g.lineJoin = "round";
    for(let i=0;i<90;i++){
      // 45° routed tracks, like a real autorouted board
      let x = r()*W, y = r()*H; g.lineWidth = 3 + Math.round(r()*2)*3;
      g.strokeStyle = bump ? "#fff" : "rgba(255,255,255,0.075)"; g.beginPath(); g.moveTo(x,y);
      for(let k=0;k<3;k++){ const len = (r()*.3+.05)*W, dir = Math.floor(r()*8)*Math.PI/4; x += Math.cos(dir)*len; y += Math.sin(dir)*len; g.lineTo(x,y); }
      g.stroke();
      g.fillStyle = bump ? "#fff" : "rgba(255,255,255,0.13)"; g.beginPath(); g.arc(x,y,7,0,7); g.fill();
      g.fillStyle = bump ? "#000" : "rgba(0,0,0,0.55)"; g.beginPath(); g.arc(x,y,3,0,7); g.fill();
    }
    for(const [hx,hz] of holes){
      const cx = (hx/w+.5)*W, cy = (hz/d+.5)*H;
      g.fillStyle = bump ? "#fff" : "#d9b25e"; g.beginPath(); g.arc(cx,cy,48,0,7); g.fill();
    }
    // silkscreen pin names, written inward from each single-row header
    const L = LABELS[b.id] || {};
    const INK = bump ? "#999" : "rgba(244,244,240,0.95)", PAD = bump ? "#fff" : "#dcb463";
    g.fillStyle = INK; g.font = `600 19px "JetBrains Mono", monospace`; g.textBaseline = "middle";
    for(const p of b.parts){
      const names = L[p.id]; if(!names || (p.rows||1) > 1 || p.axis==="z") continue;
      const len = p.n*PITCH, inward = p.z > 0 ? -1 : 1, off = (p.female ? 0.2 : 0.18);
      names.forEach((nm,i) => {
        const x = p.x - len/2 + PITCH/2 + i*PITCH, z = p.z + inward*off;
        g.save(); g.translate((x/w+.5)*W, (z/d+.5)*H); g.rotate(inward>0 ? Math.PI/2 : -Math.PI/2);
        g.textAlign = "left"; g.fillText(nm,0,0); g.restore();
        const px = (x/w+.5)*W, pz = (p.z/d+.5)*H;
        g.fillStyle = PAD; g.beginPath(); if(i===0) g.rect(px-17,pz-17,34,34); else g.arc(px, pz, 17, 0, 7); g.fill();
        g.fillStyle = INK;
      });
    }
    g.textBaseline = "alphabetic";
    g.fillStyle = INK; g.font = `700 ${Math.round(H*0.07)}px "Bricolage Grotesque", sans-serif`;
    g.textAlign = "right"; g.fillText(b.name.toUpperCase(), W-24, H-24);
  });
}

/* ============ PART BUILDERS ============ */
const PITCH = 0.254;
function box(w,h,d,mat,x=0,y=0,z=0){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); return m; }

function buildPart(p,pcbT){
  const g = new THREE.Group();
  const add = (m)=>{ g.add(m); return m; };
  switch(p.t){
    case "chip": {
      const body = add(topBox(p.w,p.h,p.d,M("#232427",{roughness:.78}),labelTex(p.label||"",'#232427','#9a9ea4',p.w,p.d)));
      body.position.y = p.h/2 + 0.02;
      const L = SILVER(), k = p.k || 6;
      if(p.legs==="dip"){
        for(let i=0;i<k;i++){ const x = -p.w/2 + PITCH/2 + i*(p.w-PITCH)/(k-1) ;
          for(const s of [-1,1]) add(box(0.06,0.3,0.12,L,x,0.12,s*(p.d/2+0.04))); }
      } else if(p.legs==="qfp"){
        for(let i=0;i<k;i++){ const t = -p.w/2*0.8 + i*(p.w*0.8)/(k-1);
          for(const s of [-1,1]){ add(box(0.035,0.03,0.12,L,t,0.02,s*(p.d/2+0.05))); add(box(0.12,0.03,0.035,L,s*(p.w/2+0.05),0.02,t)); } }
      } else if(p.legs==="sop"){
        for(let i=0;i<k;i++){ const x = -p.w/2*0.8 + i*(p.w*0.8)/Math.max(1,k-1);
          for(const s of [-1,1]) add(box(0.045,0.04,0.12,L,x,0.03,s*(p.d/2+0.05))); }
      } else if(p.legs==="sot"){
        for(let i=0;i<3;i++) add(box(0.07,0.04,0.14,L,-p.w/3+i*p.w/3,0.03,p.d/2+0.06));
        add(box(p.w*0.6,0.04,0.12,L,0,0.03,-p.d/2-0.06));
      }
      break;
    }
    case "lid": { const m = add(topBox(p.w,p.h,p.d,SILVER(),labelTex(p.label,'#b8bdc2','#3a3f45',p.w,p.d))); m.position.y = p.h/2; break; }
    case "can": { const m = add(topBox(p.w,p.h,p.d,SILVER(),labelTex(p.label,'#c6cbd0','#4a5056',p.w,p.d))); m.position.y = p.h/2; break; }
    case "module": {
      const ant = 0.6, base = add(box(p.w,0.08,p.d,M("#1d2733"),0,0.04,0));
      const canW = p.w - ant - 0.1, cx = -p.ant*(p.w/2 - canW/2 - 0.05);
      const can = add(topBox(canW,p.h-0.08,p.d-0.12,SILVER(),labelTex(p.label,'#c9ced3','#3e444a',canW,p.d-0.12)));
      can.position.set(cx,0.08+(p.h-0.08)/2,0);
      const G = M("#2b3543",{roughness:.35}), ax = p.ant*(p.w/2 - ant/2);
      for(let i=0;i<5;i++){
        const z = -p.d/2+0.2 + i*(p.d-0.4)/4;
        add(box(0.04,0.01,0.36,G,ax + (i%2?0.18:-0.18),0.085,z+0.0));
        add(box(0.4,0.01,0.04,G,ax,0.085,z));
      }
      break;
    }
    case "header": {
      const rows = p.rows||1, n = p.n, along = p.axis==="z" ? "z" : "x";
      const lenA = n*PITCH, lenB = rows*PITCH;
      const [bw,bd] = along==="x" ? [lenA,lenB] : [lenB,lenA];
      const plastic = BLACK(), pinM = GOLD();
      const pinGeo = new THREE.BoxGeometry(0.064, p.female?0.12:0.62, 0.064);
      if(p.female){
        add(box(bw,0.85,bd,plastic,0,0.425,0));
        const holeM = M("#050506");
        for(let i=0;i<n;i++) for(let r=0;r<rows;r++){
          const a = -lenA/2 + PITCH/2 + i*PITCH, b = -lenB/2 + PITCH/2 + r*PITCH;
          const h = add(box(0.09,0.01,0.09,holeM)); h.position.set(along==="x"?a:b,0.855,along==="x"?b:a);
        }
      } else {
        const up = p.dir==="up";
        add(box(bw,0.25,bd,plastic,0, up?0.125:-0.16-0.125,0));
        for(let i=0;i<n;i++) for(let r=0;r<rows;r++){
          const a = -lenA/2 + PITCH/2 + i*PITCH, b = -lenB/2 + PITCH/2 + r*PITCH;
          const pin = new THREE.Mesh(pinGeo,pinM);
          pin.position.set(along==="x"?a:b, up ? 0.25+0.31-0.05 : -0.41-0.31+0.05, along==="x"?b:a);
          add(pin);
          if(!up) add(box(0.12,0.03,0.12,pinM, pin.position.x,0.015,pin.position.z));
        }
        if(p.jumpers){
          const J = M("#e6b422",{roughness:.4});
          for(let i=0;i<n;i+=2){ const a = -lenA/2 + PITCH/2 + i*PITCH; add(box(lenB*0.95,0.42,0.22,J,0,0.6,a)); }
        }
      }
      break;
    }
    case "cast": {
      const G = GOLD(), along = p.axis==="z" ? "z" : "x", len = p.n*PITCH;
      for(let i=0;i<p.n;i++){
        const a = -len/2 + PITCH/2 + i*PITCH;
        const pad = box(along==="x"?0.15:0.24,0.012,along==="x"?0.24:0.15,G);
        pad.position.set(along==="x"?a:0,0.006,along==="x"?0:a); add(pad);
      }
      break;
    }
    case "usb": { add(box(p.w,p.h,p.d,SILVER(),0,p.h/2,0)); add(box(0.02,p.h*0.45,p.d*0.7,M("#0b0c0e"),p.x>0?p.w/2+0.005:-p.w/2-0.005,p.h/2,0)); break; }
    case "usba": {
      add(box(p.w,p.h,p.d,SILVER(),0,p.h/2,0));
      const T = M(p.blue?"#1f5fd1":"#121316");
      for(const y of [p.h*0.28,p.h*0.72]) add(box(0.03,0.16,p.d*0.6,T,p.w/2+0.01,y,0));
      break;
    }
    case "eth": { add(box(p.w,p.h,p.d,SILVER(),0,p.h/2,0)); add(box(0.03,p.h*0.6,p.d*0.6,M("#0b0c0e"),p.w/2+0.01,p.h*0.45,0)); break; }
    case "jack": { add(box(p.w,p.h,p.d,BLACK(),0,p.h/2,0)); break; }
    case "audio": {
      add(box(p.w,p.h,p.d,BLACK(),0,p.h/2,0));
      const c = add(new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.25,24),BLACK())); c.rotation.x = Math.PI/2; c.position.set(0,p.h/2,p.d/2+0.12);
      break;
    }
    case "btn": {
      add(box(p.w,0.14,p.w,SILVER(),0,0.07,0));
      const cap = add(new THREE.Mesh(new THREE.CylinderGeometry(p.w*0.28,p.w*0.28,0.16,24),BLACK())); cap.position.y = 0.22;
      break;
    }
    case "led": {
      const base = p.off ? 0 : 0.9;
      const m = add(box(p.w,0.08,p.w*0.6,M(p.off ? new THREE.Color(p.color).multiplyScalar(0.55).getStyle() : p.color,{emissive:new THREE.Color(p.color),emissiveIntensity:base})));
      m.position.y = 0.04; m.userData.baseEmissive = new THREE.Color(p.color); m.userData.baseI = base;
      const sp = glowSprite(p.color); sp.position.y = 0.12; sp.scale.setScalar(Math.max(0.5, p.w*3)); sp.material.opacity = base ? 0.7 : 0; g.add(sp); m.userData.glow = sp;
      break;
    }
    case "xtal": { const m = add(box(p.w,p.h,p.d,SILVER(),0,p.h/2,0)); break; }
    case "cap": {
      // SMD aluminium electrolytic: black plastic seat, aluminium can, dark polarity sector printed on top
      const r = p.w/2;
      add(box(p.w*1.04,0.08,p.w*1.04,BLACK(),0,0.04,0));
      const can = add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,p.h-0.08,32),M("#c8ccd0",{metalness:.85,roughness:.32}))); can.position.y = 0.08+(p.h-0.08)/2;
      const topT = canvasTex(256,256,(g)=>{ g.fillStyle = "#c8ccd0"; g.fillRect(0,0,256,256);
        g.fillStyle = "#1c1f2a"; g.beginPath(); g.moveTo(128,128); g.arc(128,128,128,Math.PI*0.75,Math.PI*1.25); g.fill();
        g.strokeStyle = "#9aa0a6"; g.lineWidth = 6; g.beginPath(); g.moveTo(60,128); g.lineTo(196,128); g.moveTo(128,60); g.lineTo(128,196); g.stroke();
        g.fillStyle = "#33363b"; g.font = "600 34px Arial"; g.textAlign = "center"; g.fillText("47",150,110); g.fillText("16V",150,178); });
      const lid = add(new THREE.Mesh(new THREE.CircleGeometry(r*0.995,32),M("#ffffff",{map:topT,metalness:.7,roughness:.35}))); lid.rotation.x = -Math.PI/2; lid.position.y = p.h+0.001;
      break;
    }
    case "pass": {
      // 0603 / 0805 / 1206 chip part: body plus two tinned end caps along its length
      add(box(p.w*0.72,p.h,p.d,M(p.color,{roughness:.55}),0,p.h/2,0));
      for(const sx of [-1,1]) add(box(p.w*0.14,p.h*1.02,p.d*1.01,SILVER(),sx*p.w*0.43,p.h/2,0));
      break;
    }
    case "melf": {
      const c = add(new THREE.Mesh(new THREE.CylinderGeometry(p.d/2,p.d/2,p.w*0.8,16),M("#7a2424",{roughness:.15,transparent:true,opacity:.92}))); c.rotation.z = Math.PI/2; c.position.y = p.d/2;
      for(const sx of [-1,1]){ const e = add(new THREE.Mesh(new THREE.CylinderGeometry(p.d/2*1.03,p.d/2*1.03,p.w*0.12,16),SILVER())); e.rotation.z = Math.PI/2; e.position.set(sx*p.w*0.44,p.d/2,0); }
      const band = add(new THREE.Mesh(new THREE.CylinderGeometry(p.d/2*1.02,p.d/2*1.02,p.w*0.08,16),BLACK())); band.rotation.z = Math.PI/2; band.position.set(p.w*0.28,p.d/2,0);
      break;
    }
    case "ffc": { add(box(p.w,p.h,p.d,M("#e8dcc0"),0,p.h/2,0)); add(box(p.w*0.9,0.08,p.d*0.95,BLACK(),0,p.h+0.04,0)); break; }
  }
  g.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

let current = null, boardGroup = null, boardBody = null, partGroups = [], selectedId = null, hoverId = null;
let exploded = false, autoSpin = false;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function disposeGroup(g){ g.traverse(o => { if(o.isMesh){ o.geometry.dispose(); [].concat(o.material).forEach(m => { m.map && m.map.dispose(); m.bumpMap && m.bumpMap.dispose(); m.dispose(); }); } }); }

// 1.6 mm board with rounded corners and drilled mounting holes; varnished top, bare fibreglass edge
function buildPcb(b){
  const {w,d,holes=[],radius=0.12} = b.pcb, x0 = -w/2, y0 = -d/2, r = radius;
  let s = new THREE.Shape();
  if(b.brd) s = brdShape(b);
  else {
    s.moveTo(x0+r,y0); s.lineTo(x0+w-r,y0); s.quadraticCurveTo(x0+w,y0,x0+w,y0+r); s.lineTo(x0+w,y0+d-r);
    s.quadraticCurveTo(x0+w,y0+d,x0+w-r,y0+d); s.lineTo(x0+r,y0+d); s.quadraticCurveTo(x0,y0+d,x0,y0+d-r);
    s.lineTo(x0,y0+r); s.quadraticCurveTo(x0,y0,x0+r,y0);
    for(const [hx,hz] of holes){ const h = new THREE.Path(); h.absarc(hx,-hz,0.15,0,Math.PI*2,true); s.holes.push(h); }
  }
  const geo = new THREE.ExtrudeGeometry(s,{depth:0.16,bevelEnabled:false,curveSegments:16});
  geo.rotateX(-Math.PI/2); geo.translate(0,-0.16,0);
  const fit = t => { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.repeat.set(1/w,1/d); t.offset.set(0.5,0.5); return t; };
  const tex = bump => b.brd ? pcbTexBrd(b,bump) : pcbTex(b,bump);
  const map = fit(tex(false)), bumpMap = fit(tex(true)); bumpMap.encoding = THREE.LinearEncoding;
  const top = new THREE.MeshPhysicalMaterial({map,bumpMap,bumpScale:0.006,roughness:0.42,metalness:0,clearcoat:0.35,clearcoatRoughness:0.3});
  const edge = M(new THREE.Color(b.pcb.color).lerp(new THREE.Color("#cdbd8c"),0.55).getStyle(),{roughness:.8});
  const m = new THREE.Mesh(geo,[top,edge]); m.castShadow = m.receiveShadow = true; return m;
}

function brdBox(e){
  // element bounding box in board millimetres, after its rotation
  const a = parseFloat(e.r.replace(/[MSR]/g,""))*Math.PI/180, mir = e.r.startsWith("M"), [x0,y0,x1,y1] = e.bb;
  const pts = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([px,py]) => { if(mir) px = -px; return [e.x+px*Math.cos(a)-py*Math.sin(a), e.y+px*Math.sin(a)+py*Math.cos(a)]; });
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}
function brdPrep(b){
  const B = b.brd; if(B.ready) return;
  const xs = B.outline.flatMap(s => [s[0],s[2]]), ys = B.outline.flatMap(s => [s[1],s[3]]);
  B.x0 = Math.min(...xs); B.y0 = Math.min(...ys); B.wmm = Math.max(...xs)-B.x0; B.hmm = Math.max(...ys)-B.y0;
  B.cx = B.x0 + B.wmm/2; B.cy = B.y0 + B.hmm/2;
  const toW = (x,y) => [(x-B.cx)/10, -(y-B.cy)/10];
  const byName = Object.fromEntries(B.els.map(e => [e.n,e])), used = new Set();
  for(const p of b.parts){
    const e = byName[p.el]; if(!e) continue; used.add(e.n);
    const bx = brdBox(e); [p.x,p.z] = toW((bx[0]+bx[2])/2,(bx[1]+bx[3])/2);
    if(p.t!=="header" && p.w && p.d && Math.abs(p.w-p.d)>0.01 && ((bx[3]-bx[1]) > (bx[2]-bx[0])) !== (p.d > p.w)) p.rot = Math.PI/2;
  }
  for(const e of B.els){
    const k = PKG[e.p]; if(!k || used.has(e.n) || e.r.startsWith("M")) continue;
    const bx = brdBox(e), [x,z] = toW((bx[0]+bx[2])/2,(bx[1]+bx[3])/2), vertical = (bx[3]-bx[1]) > (bx[2]-bx[0]);
    const [name,cat,info] = KIND_INFO[k.kind](e);
    const p = {id:"g_"+e.n, minor:true, x, z, name, cat, info};
    if(k.t==="header") Object.assign(p,{t:"header",rows:2,n:3,axis:vertical?"z":"x",dir:"up"});
    else Object.assign(p,{t:k.t,legs:k.legs,k:k.k,label:k.label||"",w:k.L/10,d:k.W/10,h:(k.H||0.6)/10,color:k.t==="led"?({GREEN:"#3ddc5a",RED:"#ff3b30"}[e.v.toUpperCase()]||"#ffb000"):k.c, off:k.t==="led" && !["ON","PWR"].includes(e.n),rot:vertical?Math.PI/2:0});
    b.parts.push(p);
  }
  B.ready = true;
}
function brdShape(b){
  const B = b.brd, segs = B.outline.map(s => s.slice(0,4)), S = (x,y) => [(x-B.cx)/10, (y-B.cy)/10];
  // chain the outline segments end to end
  const pts = [[segs[0][0],segs[0][1]],[segs[0][2],segs[0][3]]]; const left = segs.slice(1);
  const near = (a,b) => Math.abs(a[0]-b[0])<0.02 && Math.abs(a[1]-b[1])<0.02;
  while(left.length){
    const end = pts[pts.length-1], i = left.findIndex(g => near([g[0],g[1]],end) || near([g[2],g[3]],end)); if(i<0) break;
    const g = left.splice(i,1)[0]; pts.push(near([g[0],g[1]],end) ? [g[2],g[3]] : [g[0],g[1]]);
  }
  const s = new THREE.Shape(); pts.forEach(([x,y],i) => { const [a,c] = S(x,y); i ? s.lineTo(a,c) : s.moveTo(a,c); });
  for(const [x,y,dr] of B.holes){ const [a,c] = S(x,y), h = new THREE.Path(); h.absarc(a,c,dr/20,0,Math.PI*2,true); s.holes.push(h); }
  return s;
}
function pcbTexBrd(b,bump){
  const B = b.brd, K = 28, W = Math.round(B.wmm*K), H = Math.round(B.hmm*K);
  const X = x => (x-B.x0)*K, Y = y => (B.y0+B.hmm-y)*K;
  return canvasTex(W,H,(g)=>{
    g.fillStyle = bump ? "#000" : b.pcb.color; g.fillRect(0,0,W,H);
    if(!bump){ const img = g.getImageData(0,0,W,H), px = img.data, r = rng("weave"); for(let i=0;i<px.length;i+=4){ const n = (r()-.5)*6; px[i]+=n; px[i+1]+=n; px[i+2]+=n; } g.putImageData(img,0,0); }
    const COPPER = bump ? "#fff" : "rgba(150,240,230,0.09)", TIN = bump ? "#fff" : "#d3d6d8", INK = bump ? "#9a9a9a" : "#f4f5f2", HOLE = bump ? "#000" : "#121314";
    g.fillStyle = bump ? "#222" : "rgba(170,255,240,0.018)";
    for(const poly of B.pour){ g.beginPath(); poly.forEach(([x,y],i) => i ? g.lineTo(X(x),Y(y)) : g.moveTo(X(x),Y(y))); g.closePath(); g.fill(); }
    g.lineCap = "round"; g.strokeStyle = COPPER;
    for(const [x1,y1,x2,y2,w] of B.trk){ g.lineWidth = Math.max(w,0.2)*K; g.beginPath(); g.moveTo(X(x1),Y(y1)); g.lineTo(X(x2),Y(y2)); g.stroke(); }
    for(const [x,y,dr] of B.vias){ g.fillStyle = COPPER; g.beginPath(); g.arc(X(x),Y(y),(dr/2+0.3)*K,0,7); g.fill(); g.fillStyle = HOLE; g.beginPath(); g.arc(X(x),Y(y),dr/2*K,0,7); g.fill(); }
    g.fillStyle = TIN; for(const [x,y,dx,dy] of B.smd) g.fillRect(X(x)-dx/2*K, Y(y)-dy/2*K, dx*K, dy*K);
    for(const [x,y,dr,shape] of B.pads){
      const R = (dr/2+0.55)*K; g.fillStyle = TIN; g.beginPath();
      if(shape==="square") g.rect(X(x)-R,Y(y)-R,2*R,2*R); else g.arc(X(x),Y(y),R,0,7);
      g.fill(); g.fillStyle = HOLE; g.beginPath(); g.arc(X(x),Y(y),dr/2*K,0,7); g.fill();
    }
    for(const [x,y,dr] of B.holes){ g.strokeStyle = TIN; g.lineWidth = 0.6*K; g.beginPath(); g.arc(X(x),Y(y),(dr/2+0.3)*K,0,7); g.stroke(); }
    g.strokeStyle = INK;
    for(const [x1,y1,x2,y2,w] of B.silk){ g.lineWidth = Math.max(w,0.15)*K; g.beginPath(); g.moveTo(X(x1),Y(y1)); g.lineTo(X(x2),Y(y2)); g.stroke(); }
    g.fillStyle = INK;
    for(const [txt,x,y,size,rot,align] of B.text){
      if(rot.startsWith("M")) continue;   // mirrored = printed on the back
      let ang = parseFloat(rot.replace(/[MSR]/g,"")) || 0, [v,h] = align.split("-"); if(!h){ h = v; v = "center"; }
      if(!rot.includes("S") && ang>90 && ang<=270){ ang -= 180; h = h==="left"?"right":h==="right"?"left":h; v = v==="bottom"?"top":v==="top"?"bottom":v; }
      g.save(); g.translate(X(x),Y(y)); g.rotate(-ang*Math.PI/180);
      g.font = `700 ${size*K*1.32}px "Arial Narrow", Arial, sans-serif`; g.textAlign = h; g.textBaseline = v==="bottom"?"alphabetic":v==="top"?"top":"middle";
      g.fillText(txt.replace(/#/g,"~"),0,0); g.restore();
    }
  });
}

function loadBoard(b){
  if(boardGroup){ if(bbCache && bench){ bench.remove(bbCache.grp); disposeGroup(bbCache.grp); bbCache = null; } scene.remove(boardGroup); disposeGroup(boardGroup); }
  current = b; selectedId = null; hoverId = null;
  if(b.brd) brdPrep(b);
  boardGroup = new THREE.Group(); scene.add(boardGroup);
  boardBody = new THREE.Group(); boardGroup.add(boardBody);
  boardBody.add(buildPcb(b));

  partGroups = b.parts.map((p,i) => {
    const g = buildPart(p);
    g.position.set(p.x,0,p.z); if(p.rot) g.rotation.y = p.rot;
    if(p.bottom) g.rotation.x = Math.PI;   // soldered on the underside, upside down
    g.userData = {id:p.id, baseY:p.bottom?-0.16:0, idx:i, start: performance.now() + (reduceMotion?0:i*Math.min(90,2600/b.parts.length)), from: reduceMotion?0:3.5, ex:0};
    g.traverse(o => o.userData.partId = p.id);
    boardBody.add(g); return g;
  });
  if(!b.brd) scatterSmd(b);
  bench = null; resetSim();

  const span = Math.max(b.pcb.w, b.pcb.d*1.3);
  camera.position.set(span*0.55, span*0.9+1.6, span*1.05+2.2);
  controls.target.set(0,0,0); focusTarget.set(0,0,0);
  controls.update();

  document.getElementById("bName").textContent = b.name;
  document.getElementById("bTag").textContent = b.tag;
  document.getElementById("bDims").innerHTML = `${b.size}<br>${b.parts.length} composants` +
    (b.brd ? `<br><span style="pointer-events:auto">Plan réel : <a href="${b.brdSrc}" target="_blank" rel="noopener" style="color:inherit">Arduino</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener" style="color:inherit">CC BY-SA 4.0</a></span>` : "");
  document.querySelectorAll("#boardNav button").forEach(x => x.setAttribute("aria-pressed", x.dataset.id===b.id));
  document.querySelectorAll("#cmp tr[data-id]").forEach(tr => tr.style.fontWeight = tr.dataset.id===b.id ? "600" : "");
  quizState = {};
  renderPane();
}

// Tiny 0603 resistors and capacitors in the free areas, so the board reads like a real assembled PCB
function scatterSmd(b){
  const r = rng(b.id+"smd"), boxes = partGroups.map(g => new THREE.Box3().setFromObject(g).expandByScalar(0.06));
  const spots = [], tries = Math.round(b.pcb.w*b.pcb.d*40);
  const free = (x,z) => !boxes.some(bx => x>bx.min.x && x<bx.max.x && z>bx.min.z && z<bx.max.z) &&
                        !spots.some(s => Math.abs(s[0]-x)<0.22 && Math.abs(s[1]-z)<0.22);
  for(let i=0;i<tries && spots.length < b.pcb.w*b.pcb.d*2.2;i++){
    const x = (r()-.5)*(b.pcb.w-0.4), z = (r()-.5)*(b.pcb.d-0.4);
    if(free(x,z)) spots.push([x,z,r()<.5?0:Math.PI/2,r()<.55]);
  }
  const n = spots.length; if(!n) return;
  const cap = new THREE.InstancedMesh(new THREE.BoxGeometry(0.15,0.07,0.08),M("#a77c52",{roughness:.5}),n);
  const res = new THREE.InstancedMesh(new THREE.BoxGeometry(0.15,0.05,0.08),M("#141416",{roughness:.4}),n);
  const ends = new THREE.InstancedMesh(new THREE.BoxGeometry(0.035,0.075,0.085),SILVER(),n*2);
  const o = new THREE.Object3D(); let ci = 0, ri = 0;
  spots.forEach(([x,z,rot,isCap],i) => {
    o.position.set(x,0.035,z); o.rotation.set(0,rot,0); o.updateMatrix();
    if(isCap) cap.setMatrixAt(ci++,o.matrix); else res.setMatrixAt(ri++,o.matrix);
    for(const s of [-1,1]){ o.position.set(x + Math.cos(rot)*s*0.065,0.037,z - Math.sin(rot)*s*0.065); o.updateMatrix(); ends.setMatrixAt(i*2+(s>0),o.matrix); }
  });
  cap.count = ci; res.count = ri;
  [cap,res,ends].forEach(m => { m.castShadow = true; boardBody.add(m); });
}

const LANG_NAME = {arduino:"Arduino (C++)", micropython:"MicroPython", gpiozero:"Python (gpiozero)"};
const LANG_FILE = {arduino:"sketch.ino", micropython:"main.py", gpiozero:"main.py"};

/* ---- Traducteurs : Arduino C++ et Python vers JavaScript asynchrone ---- */
class CompileError extends Error { constructor(msg, line){ super(msg); this.line = line; } }

// Remplace chaînes et commentaires par des jetons pour que les transformations ne les touchent pas
function maskC(src){
  const S = []; let out = "", i = 0;
  while(i < src.length){
    const c = src[i], n = src[i+1];
    if(c==="/" && n==="/"){ const j = src.indexOf("\n",i); const e = j<0 ? src.length : j; out += " ".repeat(0); i = e; continue; }
    if(c==="/" && n==="*"){ const j = src.indexOf("*/",i+2); const e = j<0 ? src.length : j+2; out += src.slice(i,e).replace(/[^\n]/g,""); i = e; continue; }
    if(c==='"'){ let j = i+1; while(j<src.length && src[j]!=='"' && src[j]!=="\n"){ if(src[j]==="\\") j++; j++; }
      S.push(src.slice(i,j+1)); out += "\u0001"+(S.length-1)+"\u0002"; i = j+1; continue; }
    if(c==="'"){ let j = i+1; while(j<src.length && src[j]!=="'" && src[j]!=="\n"){ if(src[j]==="\\") j++; j++; }
      const lit = src.slice(i+1,j); let ch = lit;
      if(lit[0]==="\\") ch = ({n:"\n",t:"\t",r:"\r","0":"\0","\\":"\\","'":"'"})[lit[1]] ?? lit[1];
      out += String((ch||" ").charCodeAt(0)); i = j+1; continue; }
    out += c; i++;
  }
  return {code:out, S};
}
const unmask = (code, S) => code.replace(/\u0001(\d+)\u0002/g, (_,k) => S[k]);

// Trouve l'indice de la parenthèse / accolade fermante correspondante
function matchClose(s, i){
  const open = s[i], close = ({"(":")","[":"]","{":"}"})[open]; let d = 0;
  for(let j=i;j<s.length;j++){ if(s[j]===open) d++; else if(s[j]===close){ d--; if(!d) return j; } }
  return -1;
}

const C_TYPES = "long\\s+long|long\\s+int|unsigned\\s+long|unsigned\\s+int|unsigned\\s+char|unsigned|int|float|double|long|short|bool|boolean|byte|char|String|word|size_t|u?int(?:8|16|32|64)_t|auto";
const C_INT = /^(?:long|int|short|byte|char|word|size_t|unsigned|u?int\d+_t)/;

function transpileCpp(src){
  // contrôles de syntaxe légers, avec numéros de ligne comme un vrai compilateur
  const {code:masked, S} = maskC(src);
  const lines = masked.split("\n");
  let depth = {"(":0,"{":0};
  lines.forEach((ln,i) => {
    for(const ch of ln){ if(ch==="("||ch==="{") depth[ch]++; if(ch===")") depth["("]--; if(ch==="}") depth["{"]--;
      if(depth["("]<0) throw new CompileError("')' en trop", i+1); if(depth["{"]<0) throw new CompileError("'}' en trop", i+1); }
    const t = ln.trim(); if(!t || t[0]==="#") return;
    const next = (lines.slice(i+1).find(x => x.trim()) || "").trim();
    if(/^(if|for|while|switch|else|do)\b/.test(t) || /^}/.test(t) && /^(else|while)\b/.test(next)) return;
    if(/[;{},:]$/.test(t) || /^(case|default)\b/.test(t) || /(&&|\|\||[+\-*\/%=<>!?&|^])$/.test(t) || /^[+\-*\/%=<>!?&|^.]/.test(next) || /^[)\]]/.test(next)) return;
    if(depth["("]>0) return;
    if(/\)$/.test(t) && /^\{/.test(next)) return;
    if(/^(void|int|float|double|long|bool|boolean|byte|char|String|unsigned)\b.*\)$/.test(t)) return;
    throw new CompileError("';' attendu à la fin de la ligne", i+1);
  });
  if(depth["{"]>0) throw new CompileError("'}' manquant à la fin du fichier", lines.length);
  if(depth["("]>0) throw new CompileError("')' manquant", lines.length);
  if(!/\bvoid\s+setup\s*\(/.test(masked)) throw new CompileError("la fonction setup() est introuvable", 1);
  if(!/\bvoid\s+loop\s*\(/.test(masked)) throw new CompileError("la fonction loop() est introuvable", 1);

  let c = masked;
  const hoist = [];
  // préprocesseur
  c = c.replace(/^[ \t]*#\s*include[^\n]*/gm, "")
       .replace(/^[ \t]*#\s*define[ \t]+(\w+)[ \t]+([^\n]+)/gm, "const $1 = $2;")
       .replace(/^[ \t]*#\s*define[ \t]+(\w+)[ \t]*$/gm, "const $1 = 1;")
       .replace(/^[ \t]*#[^\n]*/gm, "");
  c = c.replace(/\bPROGMEM\b|\bconstexpr\b|\binline\b/g, "").replace(/([(,=]\s*)&(?=[A-Za-z_])/g, "$1");
  // suffixes numériques et transtypages
  c = c.replace(/\b(0x[0-9a-fA-F]+)[uUlL]+\b/g, "$1").replace(/\b(\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)(?:[uU]?[lL]{1,2}|[uU]|[fF])\b/g, "$1");
  c = c.replace(/\(\s*(?:unsigned\s+)?(?:int|byte|char|short|word|u?int(?:8|16)_t)\s*\)\s*/g, "0|")
       .replace(/\(\s*(?:unsigned\s+)?(?:long|float|double|u?int(?:32|64)_t|bool|boolean)\s*\)\s*/g, "");
  c = c.replace(/sizeof\s*\(\s*(\w+)\s*\)\s*\/\s*sizeof\s*\(\s*\1\s*\[\s*0\s*\]\s*\)/g, "$1.length").replace(/sizeof\s*\(\s*(\w+)\s*\)/g, "__sizeof($1)");
  c = c.replace(/\bNULL\b|\bnullptr\b/g, "null").replace(/\.length\(\)/g, ".length");
  // prototypes et définitions de fonctions
  const fnNames = [];
  const fnRe = new RegExp(`^([ \\t]*)(?:static\\s+)?(?:const\\s+)?(?:void|${C_TYPES})(?:\\s*[*&]\\s*|\\s+)(\\w+)\\s*\\(([^)]*)\\)\\s*(;|\\{)`, "gm");
  c = c.replace(fnRe, (m, ind, name, params, end) => {
    if(end===";") return ind;
    fnNames.push(name);
    const ps = params.trim()==="void" || !params.trim() ? "" : params.split(",").map(p => {
      const [decl, def] = p.split("=");
      const id = (decl.replace(/\[\s*\]/g,"").match(/(\w+)\s*$/) || ["","_"])[1];
      return def ? `${id} = ${def.trim()}` : id;
    }).join(", ");
    return `${ind}async function ${name}(${ps}) {`;
  });
  // variables statiques locales : remontées en globales
  c = c.replace(new RegExp(`^([ \\t]+)static\\s+(?:const\\s+|volatile\\s+)*(?:${C_TYPES})\\s+(\\w+)\\s*(=\\s*[^;]+)?;`, "gm"), (m, ind, name, init) => {
    hoist.push(`let ${name} ${init || "= 0"};`); return ind;
  });
  // objets de bibliothèques
  const LIBS = "Servo|Adafruit_SSD1306|DHT|LiquidCrystal_I2C|Adafruit_NeoPixel|TM1637Display|LedControl|Stepper";
  c = c.replace(new RegExp(`(^|[;{}]|\\n)(\\s*)(${LIBS})\\s+(\\w+)\\s*\\[\\s*(\\w+)\\s*\\]\\s*;`, "g"), (m, a, sp, cls, name, n) => `${a}${sp}let ${name} = Array.from({length:${n}}, () => new ${cls}());`);
  c = c.replace(new RegExp(`(^|[;{}]|\\n)(\\s*)(${LIBS})\\s+(\\w+)\\s*=\\s*\\3\\s*\\(([^;]*)\\)\\s*;`, "g"), (m, a, sp, cls, name, args) => `${a}${sp}let ${name} = new ${cls}(${args||""});`);
  c = c.replace(new RegExp(`(^|[;{}]|\\n)(\\s*)(${LIBS})\\s+(\\w+)\\s*(?:\\(([^;]*)\\))?\\s*;`, "g"), (m, a, sp, cls, name, args) => `${a}${sp}let ${name} = new ${cls}(${args||""});`);
  c = c.replace(/\b(millis|micros)\(\)\s*\/\s*(\d+)\b(?![\w.])/g, "__i($1() / $2)");
  // tableaux
  const intNames = new Set();
  const declRe = new RegExp(`(^|[;{}(]|\\n)(\\s*)((?:(?:const|static|volatile|unsigned|signed)\\s+)*)(${C_TYPES})(\\s*\\*\\s*|\\s+)(?=[A-Za-z_])`, "g");
  c = c.replace(declRe, (m, a, sp, quals, type, star) => {
    if(star.includes("*")) return `${a}${sp}let `;
    const isInt = C_INT.test(type.replace(/\s+/g," ")) || /unsigned/.test(quals);
    return `${a}${sp}let${isInt?"\u0003":type==="String"?"\u0006":""} `;
  });
  // let nom[N] = {…}; → tableaux JS
  let out = "", i = 0;
  const arrRe = /let[\u0003\u0006]?\s+(\w+)\s*((?:\[[^\]]*\])+)\s*(=\s*)?/g; let m;
  while((m = arrRe.exec(c))){
    out += c.slice(i, m.index) + `let ${m[1]} = `; i = m.index + m[0].length;
    if(m[3]){
      if(c[i]==="{"){ const e = matchClose(c,i); out += c.slice(i,e+1).replace(/\{/g,"[").replace(/\}/g,"]"); i = e+1; }
    } else {
      const dims = [...m[2].matchAll(/\[([^\]]*)\]/g)].map(x => x[1] || "0");
      out += dims.length===1 ? `new Array(${dims[0]}).fill(0)` : `Array.from({length:${dims[0]}},()=>new Array(${dims[1]}).fill(0))`;
    }
    arrRe.lastIndex = i;
  }
  c = out + c.slice(i);
  // entiers : on tronque l'initialisation et les affectations simples
  c = c.replace(/let\u0003\s+([^;]+);/g, (m, body) => {
    const parts = []; let d = 0, s = 0;
    for(let k=0;k<=body.length;k++){ const ch = body[k]; if(ch==="("||ch==="["||ch==="{") d++; else if(ch===")"||ch==="]"||ch==="}") d--; else if((ch===","&&!d)||k===body.length){ parts.push(body.slice(s,k)); s = k+1; } }
    return "let " + parts.map(p => { const eq = p.search(/=(?!=)/); const id = p.slice(0, eq<0?p.length:eq).trim(); intNames.add(id);
      return eq<0 ? `${id} = 0` : `${id} = __i(${p.slice(eq+1).trim()})`; }).join(", ") + ";";
  });
  c = c.replace(/let\u0003\s+/g, "let ").replace(/let\u0006\s+(\w+)\s*;/g, 'let $1 = "";').replace(/let\u0006\s+/g, "let ");
  c = c.replace(/(^|[;{})]\s*|\n\s*)([A-Za-z_]\w*)\s*(=|\*=|\/=)(?!=)\s*([^;]+);/g, (m, a, id, op, rhs) => {

/* ---- Horloge simulée et ordonnanceur ---- */
const STOP = {stop:true};
const rt = {gen:0, running:false, paused:false, now:0, timers:[], baseSim:0, baseReal:0, lastYield:0, resumeQ:[], speedHist:[], ended:false, err:null};
const simTarget = () => rt.baseSim + (performance.now() - rt.baseReal);
const mcQ = [], mc = new MessageChannel();
mc.port1.onmessage = () => { const f = mcQ.shift(); if(f) f(); };
const macrotask = () => new Promise(r => { mcQ.push(r); mc.port2.postMessage(0); });
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
function addTimer(due, fn){ const t = {due, fn}; let k = rt.timers.length; while(k>0 && rt.timers[k-1].due > due) k--; rt.timers.splice(k,0,t); return t; }
function waitResume(){ return new Promise(r => rt.resumeQ.push(r)); }

async function pump(g){
  let frameT = performance.now();
  while(g===rt.gen){
    if(rt.paused){ await waitResume(); frameT = performance.now(); continue; }
    let target = simTarget();
    // le programme n'arrive pas à suivre : on ralentit l'horloge simulée plutôt que de tout rattraper
    if(target - rt.now > 1000){ rt.baseSim = rt.now + 50; rt.baseReal = performance.now(); target = simTarget(); }
    if(rt.timers.length && rt.timers[0].due <= target){
      const t = rt.timers.shift(); rt.now = Math.max(rt.now, t.due); t.fn();
      for(let k=0;k<40;k++) await null;   // laisse le programme avancer jusqu'à sa prochaine attente
      // programme en boucle d'interrogation (sans delay) : il doit voir chaque changement d'état
      if(performance.now() - (rt.pollT||0) < 60) await macrotask();
      if(performance.now() - frameT > 12){ await new Promise(r => setTimeout(r, 0)); frameT = performance.now(); }
    } else {
      rt.now = Math.max(rt.now, rt.timers.length ? Math.min(target, rt.timers[0].due) : target);
      const wait = rt.timers.length ? rt.timers[0].due - target : 16;
      await new Promise(r => setTimeout(r, Math.max(1, Math.min(16, wait)))); frameT = performance.now();
    }
  }
}

// interruptions et rappels quand une entrée change
hw.watch = [];
function inputChanged(n){
  if(!hw.watch.some(w => w.n===n)) return;
  const v = inputRead(n, true);
  for(const w of hw.watch) if(w.n===n && w.g===rt.gen && rt.running && !rt.paused){
    const edge = v ? "rise" : "fall";
    if(w.mode==="change" || w.mode===edge) Promise.resolve().then(() => w.fn(v)).catch(e => runtimeError(e));
  }

const audio = {ctx:null, osc:null, gain:null, muted:false};

  if(audio.ctx) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext; audio.ctx = new C();

    const lp = audio.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5000;
    audio.osc = audio.ctx.createOscillator(); audio.osc.type = "square"; audio.osc.frequency.value = 440;

  if(!audio.ctx) return;
  const buz = lab().comps.filter(c => c.type==="buzzer").map(c => c.nums.s);
  let f = 0; for(const n of buz){ if(hw.tones.get(n)) { f = hw.tones.get(n); break; } }

const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;
const WRAP_LINES = 3;   // lignes ajoutées avant le code : en-tête de la fonction + « with »
function errLine(e){

}
function frenchError(e, lang){
  let msg = e && e.message ? e.message : String(e);
  let mm;
  if(e instanceof ReferenceError && (mm = msg.match(/^(\w+) is not defined/))) msg = lang==="arduino" ? `'${mm[1]}' n'a pas été déclaré dans cette portée` : `NameError: le nom '${mm[1]}' n'est pas défini`;
  else if(e instanceof TypeError && (mm = msg.match(/(\S+) is not a function/))) msg = lang==="arduino" ? `'${mm[1]}' n'est pas une fonction connue` : `TypeError: '${mm[1]}' n'est pas appelable`;
  else if(e instanceof TypeError && /Cannot read properties of (undefined|null)/.test(msg)) msg = lang==="arduino" ? "accès à un objet inexistant" : "AttributeError: 'NoneType' n'a pas cet attribut";

function runtimeError(e){
  if(e===STOP) return;
  const L = lab(), line = errLine(e);
  L.errLine = line; stopSim(true);
  consoleMsg(`${L.lang==="arduino" ? "Erreur" : "Traceback"}${line ? ` (ligne ${line})` : ""} : ${frenchError(e, L.lang)}`, "err");
  if(L.lang!=="arduino") serialOut(`Traceback (most recent call last):\n  File "main.py", line ${line ?? "?"}\n${frenchError(e, L.lang)}\n`);

}

// Toute variable non déclarée déclenche une erreur, comme le ferait le compilateur
const PASS = new Set(["Math","Number","String","Array","Object","JSON","Promise","Symbol","Error","TypeError","RangeError","ReferenceError","isNaN","isFinite","parseInt","parseFloat","Infinity","NaN","undefined","Boolean","Date","Map","Set","console"]);
function scopeProxy(E){
  return new Proxy(E, {
    has: (t, k) => typeof k==="string" && (k in t || !PASS.has(k)),
    get: (t, k) => { if(typeof k!=="string") return undefined; if(k in t) return t[k]; if(PASS.has(k)) return globalThis[k]; throw new ReferenceError(k + " is not defined"); },
    set: (t, k, v) => { if(k in t){ t[k] = v; return true; } throw new ReferenceError(k + " is not defined"); }
  });
}
function compile(L){
  const envMaker = L.lang==="arduino" ? arduinoEnv : L.lang==="micropython" ? micropythonEnv : gpiozeroEnv;
  const probe = envMaker(-1);
  const js = L.lang==="arduino" ? transpileCpp(L.code) : transpilePy(L.code, new Set(Object.keys(probe)));
  const fn = new AsyncFn("__env", "with(__env){\n" + js + "\n}");
  return {fn, envMaker: g => scopeProxy(envMaker(g))};
}

function startSim(){
  const L = lab();
  stopSim(true);
  L.errLine = null; L.console = []; hw.warned.clear();
  let prog;
  try{ prog = compile(L); }
  catch(e){
    L.errLine = e.line || null;
    consoleMsg(`${LANG_FILE[L.lang]}${e.line ? ":" + e.line : ""} : ${e instanceof CompileError ? "erreur" : "erreur de syntaxe"} : ${e.message}`, "err");
    renderEditorMarks(); renderRunState(); return;
  }
  resetHw();
  const g = ++rt.gen;
  resetVehicle(L); vehPrev = null;
  Object.assign(rt, {running:true, paused:false, now:0, timers:[], baseSim:0, baseReal:performance.now(), lastYield:performance.now(), ended:false, speedHist:[]});
  audioInit(); if(audio.ctx && audio.ctx.state==="suspended") audio.ctx.resume();
  L.serial = ""; const s = document.getElementById("serial"); if(s) s.textContent = "";
  consoleMsg(L.lang==="arduino" ? `Compilation réussie. Téléversement sur ${current.name}…` : `Copie de ${LANG_FILE[L.lang]} sur la carte…`, "ok");
  L.compiledCode = L.code; renderEditorMarks(); speedRef = null;
  const env = prog.envMaker(g);
  pump(g);
  (async () => {
    try{
      const r = await prog.fn(env);

        while(true){ if(r.loop) await r.loop(); await env.__y(); }

function bbOutline(W, D, tabs){
  // contour arrondi avec les queues d'aronde qui permettent d'assembler plusieurs breadboards
  const s = new THREE.Shape(), x0 = -W/2, x1 = W/2, y0 = -D/2, y1 = D/2, r = 0.07, tw = 0.34, tn = 0.22, td = 0.14;
  const tabYs = [-D/4, D/4];
  s.moveTo(x0 + r, y0); s.lineTo(x1 - r, y0); s.quadraticCurveTo(x1, y0, x1, y0 + r);
  // côté droit : encoches femelles
  for(const ty of tabYs){ s.lineTo(x1, ty - tw/2); s.lineTo(x1 - td, ty - tn/2); s.lineTo(x1 - td, ty + tn/2); s.lineTo(x1, ty + tw/2); }
  s.lineTo(x1, y1 - r); s.quadraticCurveTo(x1, y1, x1 - r, y1); s.lineTo(x0 + r, y1); s.quadraticCurveTo(x0, y1, x0, y1 - r);
  // côté gauche : tenons mâles
  for(const ty of [...tabYs].reverse()){ s.lineTo(x0, ty + tn/2); s.lineTo(x0 - td, ty + tw/2); s.lineTo(x0 - td, ty - tw/2); s.lineTo(x0, ty - tn/2); }
  s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
  return s;
}
function breadboardMesh(){
  const L = lab(), S = bbSpec(), C = BB_COLORS[L.bb.color] || BB_COLORS.white, {BZ, TY} = benchGeom();
  const W = S.W, D = S.D, K = S.cols>40 ? 110 : 160, PW = Math.round((W+0.3)*K), PD = Math.round(D*K);
  const X = x => (x + W/2 + 0.15)/(W + 0.3)*PW, Z = z => (z/D + .5)*PD, hs = 0.094*K;
  const holes = [];
  for(let c=0;c<S.cols;c++) for(let r=0;r<10;r++) holes.push([colX(c), rowZ(r)]);
  if(S.rails) for(const side of ["top","bot"]) for(const pol of ["+","-"]) for(let c=1;c<S.cols;c++) if(railOk(c)) holes.push([colX(c), RAIL_Z[side][pol]]);
  const grp = new THREE.Group();
  // dessus : couleurs, inscriptions et ombrage autour des trous
  const tex = canvasTex(PW, PD, (g) => {
    g.fillStyle = C.body; g.fillRect(0,0,PW,PD);
    const img = g.getImageData(0,0,PW,PD), px = img.data; for(let i=0;i<px.length;i+=4){ const n = (Math.random()-.5)*(C.clear ? 2 : 6); px[i]+=n; px[i+1]+=n; px[i+2]+=n; } g.putImageData(img,0,0);
    if(S.rails) for(const z of [-1.75, 1.75]){ g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 2; g.beginPath(); g.moveTo(0,Z(z)); g.lineTo(PW,Z(z)); g.stroke(); }
    for(const [x,z] of holes){ const gr = g.createRadialGradient(X(x),Z(z),hs*0.4,X(x),Z(z),hs*1.15); gr.addColorStop(0,"rgba(0,0,0,.45)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(X(x)-hs*1.2, Z(z)-hs*1.2, hs*2.4, hs*2.4); }
    if(S.rails) for(const side of ["top","bot"]) for(const pol of ["+","-"]){
      const z = RAIL_Z[side][pol], lz = side==="top" ? (pol==="-" ? z-0.18 : z+0.18) : (pol==="+" ? z-0.18 : z+0.18);
      g.strokeStyle = pol==="+" ? "#d8352a" : "#2a62c9"; g.lineWidth = 0.022*K; g.beginPath(); g.moveTo(X(colX(0)),Z(lz)); g.lineTo(X(colX(S.cols-1)),Z(lz)); g.stroke();
      g.fillStyle = g.strokeStyle; g.font = `700 ${0.2*K}px Arial`; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(pol==="+" ? "+" : "−", X(colX(0)-0.22), Z(z)); g.fillText(pol==="+" ? "+" : "−", X(colX(S.cols-1)+0.22), Z(z));
    }
    g.fillStyle = C.ink; g.font = `600 ${0.105*K}px Arial`; g.textAlign = "center"; g.textBaseline = "middle";
    "abcdefghij".split("").forEach((ch,r) => { g.fillText(ch, X(colX(0) - 0.19), Z(rowZ(r))); g.fillText(ch, X(colX(S.cols-1) + 0.19), Z(rowZ(r))); });
    for(let c=0;c<S.cols;c++) if(c===0 || (c+1)%5===0){ g.fillText(String(c+1), X(colX(c)), Z(rowZ(0)-0.2)); g.fillText(String(c+1), X(colX(c)), Z(rowZ(9)+0.2)); }
  });
  // masque : les trous et la rainure centrale sont réellement découpés
  const alpha = canvasTex(PW, PD, (g) => {
    g.fillStyle = "#fff"; g.fillRect(0,0,PW,PD); g.fillStyle = "#000";
    for(const [x,z] of holes) g.fillRect(X(x)-hs/2, Z(z)-hs/2, hs, hs);
    g.fillRect(X(colX(0)-0.12), Z(-0.105), X(colX(S.cols-1)+0.12) - X(colX(0)-0.12), Z(0.105) - Z(-0.105));
  });
  alpha.encoding = THREE.LinearEncoding;
  const fit = t => { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.repeat.set(1/(W+0.3), 1/D); t.offset.set((W/2+0.15)/(W+0.3), 0.5); return t; };
  fit(tex); fit(alpha);
  const shape = bbOutline(W, D);
  const topMat = C.clear ? new THREE.MeshPhysicalMaterial({map:tex, alphaMap:alpha, alphaTest:0.5, transparent:true, opacity:0.55, roughness:0.12, clearcoat:1, clearcoatRoughness:0.08, depthWrite:false, side:THREE.DoubleSide})
                         : new THREE.MeshStandardMaterial({map:tex, alphaMap:alpha, alphaTest:0.5, roughness:0.6, side:THREE.DoubleSide});
  const top = new THREE.Mesh(new THREE.ShapeGeometry(shape, 8), topMat);
  top.rotation.x = -Math.PI/2; top.position.set(0, TY, BZ); top.receiveShadow = true; grp.add(top);
  const wallM = C.clear ? new THREE.MeshPhysicalMaterial({color:C.body, transparent:true, opacity:0.32, roughness:0.1, clearcoat:1, depthWrite:false}) : M(C.body,{roughness:.7});
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, {depth:BBH-0.006, bevelEnabled:false, curveSegments:8}), [new THREE.MeshBasicMaterial({visible:false}), wallM]);
  body.rotation.x = -Math.PI/2; body.position.set(0, GROUND_Y, BZ); body.castShadow = !C.clear; body.receiveShadow = true; grp.add(body);
  // fond et papier adhésif
  const bottom = new THREE.Mesh(new THREE.ShapeGeometry(shape, 8), C.clear ? wallM : M(C.well,{roughness:.9}));
  bottom.rotation.x = -Math.PI/2; bottom.position.set(0, GROUND_Y + 0.05, BZ); grp.add(bottom);
  if(!C.clear){ const paper = box(W-0.08, 0.03, D-0.08, M("#e7dcb8",{roughness:.95}), 0, GROUND_Y + 0.015, BZ); grp.add(paper); }
  // puits sous chaque trou et rainure centrale
  if(!C.clear){
    const wellM = new THREE.MeshStandardMaterial({color:C.well, roughness:1, side:THREE.BackSide});
    const wg = new THREE.CylinderGeometry(0.067, 0.067, 0.22, 4, 1, true); wg.rotateY(Math.PI/4);
    const wells = new THREE.InstancedMesh(wg, wellM, holes.length), o = new THREE.Object3D();
    holes.forEach(([x,z],i) => { o.position.set(x, TY - 0.11, BZ + z); o.updateMatrix(); wells.setMatrixAt(i, o.matrix); });
    grp.add(wells);
    const troughM = new THREE.MeshStandardMaterial({color:new THREE.Color(C.body).multiplyScalar(0.62), roughness:.85, side:THREE.BackSide});
    grp.add(box(colX(S.cols-1) - colX(0) + 0.24, 0.36, 0.21, troughM, 0, TY - 0.18, BZ));
  }
  // lames de contact en bronze : une par groupe de 5 trous, une par rail
  const clipM = new THREE.MeshStandardMaterial({color:"#a8854f", metalness:0.85, roughness:0.38});
  const nClip = S.cols*2 + (S.rails ? 4 : 0);
  const clips = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), clipM, nClip), o2 = new THREE.Object3D(); let ci = 0;
  for(let c=0;c<S.cols;c++) for(const half of [0,1]){ const z = (rowZ(half*5) + rowZ(half*5+4))/2; o2.position.set(colX(c), TY - 0.27, BZ + z); o2.scale.set(0.13, 0.08, 4*PITCH + 0.16); o2.updateMatrix(); clips.setMatrixAt(ci++, o2.matrix); }
  if(S.rails) for(const side of ["top","bot"]) for(const pol of ["+","-"]){ o2.position.set((colX(1) + colX(S.cols-1))/2, TY - 0.27, BZ + RAIL_Z[side][pol]); o2.scale.set(colX(S.cols-1) - colX(1) + 0.16, 0.08, 0.13); o2.updateMatrix(); clips.setMatrixAt(ci++, o2.matrix); }
  grp.add(clips);
  if(C.clear) for(const [x,z] of holes) {} // les lames suffisent à rendre la breadboard lisible
  return grp;
}

// Fil Dupont : boîtier noir à chaque bout et courbe souple
function dupont(a, b, color, k=0, femaleA=true){
  const g = new THREE.Group(), ins = M(color,{roughness:.42}), HOUS = M("#151517",{roughness:.5});
  const d = a.distanceTo(b), top = Math.max(a.y, b.y) + 0.7 + d*0.1 + k*0.09;
  const pA = a.clone().add(new THREE.Vector3(0, 0.62, 0)), pB = b.clone().add(new THREE.Vector3(0, 0.62, 0));
  const mid = pA.clone().lerp(pB, 0.5); mid.y = top;
  const qa = pA.clone().lerp(mid, 0.3); qa.y = pA.y + (top - pA.y)*0.75; const qb = pB.clone().lerp(mid, 0.3); qb.y = pB.y + (top - pB.y)*0.75;
  g.add(tube([pA.clone().add(new THREE.Vector3(0,-0.02,0)), pA.clone().add(new THREE.Vector3(0,0.18,0)), qa, mid, qb, pB.clone().add(new THREE.Vector3(0,0.18,0)), pB.clone().add(new THREE.Vector3(0,-0.02,0))], 0.052, ins, 0.5));
  for(const [p, fem] of [[a, femaleA], [b, false]]){
    g.add(box(0.25, 0.6, 0.25, HOUS, p.x, p.y + 0.31, p.z));
    g.add(cyl(0.06, 0.1, SILVER(), p.x, p.y + 0.65, p.z, 10));
    if(!fem) g.add(box(0.06, 0.3, 0.06, GOLD(), p.x, p.y - 0.1, p.z));
  }
  return g;
}
// Fil rigide plié à angle droit, bouts dénudés
function rigidWire(a, b, color, k=0){
  const g = new THREE.Group(), ins = M(color,{roughness:.55}), h = Math.max(a.y, b.y) + 0.32 + (k%6)*0.07, rr = 0.1;
  const pts = [a.clone().setY(a.y + 0.1), new THREE.Vector3(a.x, h, a.z), new THREE.Vector3(a.x, h, b.z), new THREE.Vector3(b.x, h, b.z), b.clone().setY(b.y + 0.1)]
    .filter((p,i,arr) => i===0 || p.distanceTo(arr[i-1]) > 0.01);
  const path = new THREE.CurvePath();
  let prev = pts[0];
  for(let i=1;i<pts.length;i++){
    const p = pts[i], next = pts[i+1];
    if(!next){ path.add(new THREE.LineCurve3(prev, p)); break; }
    const inD = p.clone().sub(prev), outD = next.clone().sub(p);
    const r1 = Math.min(rr, inD.length()/2), r2 = Math.min(rr, outD.length()/2);
    const c0 = p.clone().addScaledVector(inD.normalize(), -r1), c1 = p.clone().addScaledVector(outD.normalize(), r2);
    if(c0.distanceTo(prev) > 1e-4) path.add(new THREE.LineCurve3(prev, c0));
    path.add(new THREE.QuadraticBezierCurve3(c0, p, c1)); prev = c1;
  }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(path, Math.max(40, pts.length*20), 0.034, 8), ins));
  for(const p of [a, b]) g.add(cyl(0.017, 0.26, SILVER(), p.x, p.y - 0.03, p.z, 6));
  return g;
}
// Fil souple en silicone, embouts fins
function softWire(a, b, color, k=0){
  const g = new THREE.Group(), ins = M(color,{roughness:.3}), HOUS = M("#2a2b2f",{roughness:.45});
  const d = a.distanceTo(b), top = Math.max(a.y, b.y) + 0.5 + d*0.05 + (k%5)*0.05;
  const pA = a.clone().setY(a.y + 0.48), pB = b.clone().setY(b.y + 0.48), side = ((k%3) - 1)*0.35;
  const dir = pB.clone().sub(pA).setY(0).normalize(), perp = new THREE.Vector3(-dir.z, 0, dir.x);
  const mid = pA.clone().lerp(pB, 0.5).setY(top).addScaledVector(perp, side);
  const q1 = pA.clone().lerp(mid, 0.4).setY(top - 0.05).addScaledVector(perp, side*0.4), q2 = pB.clone().lerp(mid, 0.4).setY(top - 0.12).addScaledVector(perp, side*0.4);
  g.add(tube([pA.clone().setY(pA.y - 0.02), pA.clone().setY(pA.y + 0.2), q1, mid, q2, pB.clone().setY(pB.y + 0.2), pB.clone().setY(pB.y - 0.02)], 0.042, ins, 0.5));
  for(const p of [a, b]){ g.add(box(0.19, 0.46, 0.19, HOUS, p.x, p.y + 0.24, p.z)); g.add(box(0.05, 0.28, 0.05, GOLD(), p.x, p.y - 0.08, p.z)); }
  return g;
}
function boardWire(a, b, color, k){
  const st = lab().bb.wire;
  return st==="rigid" ? rigidWire(a, b, color, k) : st==="soft" ? softWire(a, b, color, k) : dupont(a, b, color, k);
}

function resistorColors(ohms){
  const C = ["#141414","#7a4a1c","#d22b22","#f07a12","#f2d21b","#2f9a3a","#2958c9","#8c3fbf","#8a8a8a","#f4f4f4"];
  const e = Math.floor(Math.log10(ohms)) - 1, d = Math.round(ohms / 10**e);
  return [C[Math.floor(d/10)], C[d%10], C[e], "#c8a14a"];
}
function resistor3D(a, b, ohms){

  for(const p of [a,b]) g.add(box(0.03, 0.28, 0.03, legM, p.x, p.y + 0.11, p.z));
  const len = a.distanceTo(b), mid = a.clone().lerp(b, 0.5).setY(h);
  const lead = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,len,6), legM); lead.position.copy(mid); g.add(lead);
  const prof = []; for(let i=0;i<=20;i++){ const t = i/20, y = (t-.5)*0.62; const r = 0.085 + 0.025*Math.max(Math.cos(t*Math.PI*1.0)**8, Math.cos((t-1)*Math.PI)**8) * 1 + (t<0.12||t>0.88 ? 0.012 : 0); prof.push(new THREE.Vector2(i===0||i===20 ? 0.03 : r, y)); }
  const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 20), M("#d9c49b",{roughness:.55})); body.position.copy(mid); g.add(body);
  resistorColors(ohms).forEach((c,i) => { const r = cyl(0.104, 0.045, M(c,{roughness:.5}), 0, -0.2 + i*0.11 + (i===3 ? 0.08 : 0), 0, 20); body.add(r); });
  const axis = b.clone().sub(a).normalize(), q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), axis);
  lead.quaternion.copy(q); body.quaternion.copy(q);

}

let bbCache = null;
function buildBench(){
  const L = lab(), I = io(), S = bbSpec(), {BZ, TY} = benchGeom();
  const key = [current.id, L.bb.size, L.bb.color].join("|");
  if(bench){ if(bbCache) bench.remove(bbCache.grp); boardGroup.remove(bench); disposeGroup(bench); }
  if(!bbCache || bbCache.key!==key){ if(bbCache) disposeGroup(bbCache.grp); bbCache = {key, grp:breadboardMesh()}; }
  applyBoardPos();
  bench = new THREE.Group(); bench.userData = {hits:[], comps:{}, moves:[]}; boardGroup.add(bench);
  busUse = {};
  bench.add(bbCache.grp);
  layoutComps(L);
  let k = 0; const nextK = () => k++;
  const W = (a, b, color) => bench.add(boardWire(a, b, color, nextK()));
  const boardPin = n => { const p = I.pins.find(x => x.num===n); return hdrPinPos(p ? p.label : n===I.sda.num ? I.sda.label : I.scl.label); };
  const wc = (c, key, dflt) => (c.wires && c.wires[key]) || dflt;
  // alimentation : carte → rails du haut (ou colonnes de bus sur la mini)
  W(hdrPinPos(I.vcc[1], I.vcc[0]), RL("top","+",1), WIRE_PAL.rouge);
  W(hdrPinPos(I.gnd[1], I.gnd[0]), RL("top","-",2), WIRE_PAL.noir);
  let usesBottom = false;
  L.comps.forEach(c => {
    if(c.off) return;
    const cc = c.col, V = {};
    if(c.type==="led"){
      W(boardPin(c.nums.a), H(cc,0), wc(c,"a"));
      bench.add(c.R ? resistor3D(H(cc,4), H(cc,5), c.R) : flatJumper(H(cc,4), H(cc,5), "#e8e8e8"));
      const L3 = led3D([H(cc,7), H(cc+1,7)], LED_COLORS[c.color||"red"][1]); bench.add(L3.g); Object.assign(V, L3);
      bench.add(flatJumper(H(cc+1,9), RL("bot","-",cc+1), "#1d1d20")); usesBottom = true;
    } else if(c.type==="rgb"){
      [["r",cc],["g",cc+2],["b",cc+3]].forEach(([kk, x]) => { W(boardPin(c.nums[kk]), H(x,0), wc(c,kk)); bench.add(resistor3D(H(x,4), H(x,5), 220)); });
      const L3 = led3D([H(cc,7), H(cc+1,7), H(cc+2,7), H(cc+3,7)], "#ffffff", true); bench.add(L3.g); Object.assign(V, L3);
      bench.add(flatJumper(H(cc+1,9), RL("bot","-",cc+1), "#1d1d20")); usesBottom = true;
    } else if(c.type==="button"){
      W(boardPin(c.nums.s), H(cc,0), wc(c,"s"));
      const B3 = button3D([H(cc,4), H(cc+2,4), H(cc,5), H(cc+2,5)], c.cap || "#d23a2b"); bench.add(B3.g); Object.assign(V, B3);
      bench.userData.hits.push({obj:B3.cap, comp:c, kind:"button"});
      bench.add(flatJumper(H(cc+2,9), RL("bot","-",cc+2), "#1d1d20")); usesBottom = true;
    } else if(c.type==="pot"){
      const P3 = pot3D([H(cc,6), H(cc+1,6), H(cc+2,6)]); bench.add(P3.g); Object.assign(V, P3);
      bench.userData.hits.push({obj:P3.hit, comp:c, kind:"pot"});
      W(boardPin(c.nums.s), H(cc+1,5), wc(c,"s"));
      bench.add(flatJumper(H(cc,9), RL("bot","-",cc), "#1d1d20"), flatJumper(H(cc+2,9), RL("bot","+",cc+2), "#d3271f")); usesBottom = true;
    } else if(c.type==="buzzer"){
      const Z3 = buzzer3D(H(cc,6), H(cc+3,6)); bench.add(Z3.g); Object.assign(V, Z3);
      W(boardPin(c.nums.s), H(cc,9), wc(c,"s"));
      bench.add(flatJumper(H(cc+3,9), RL("bot","-",cc+3), "#1d1d20")); usesBottom = true;
    } else if(c.type==="servo"){
      const S3 = servo3D([H(cc,2), H(cc+1,2), H(cc+2,2)]); bench.add(S3.g); Object.assign(V, S3);
      bench.add(flatJumper(H(cc,0), RL("top","-",cc), "#1d1d20"), flatJumper(H(cc+1,0), RL("top","+",cc+1), "#d3271f"));
      W(boardPin(c.nums.s), H(cc+2,1), wc(c,"s"));
    } else if(c.type==="oled"){
      const O3 = oled3D([H(cc,9), H(cc+1,9), H(cc+2,9), H(cc+3,9)]); bench.add(O3.g); Object.assign(V, O3);
      bench.add(flatJumper(H(cc,5), RL("top","-",cc), "#1d1d20"), flatJumper(H(cc+1,5), RL("top","+",cc+1), "#d3271f"));
      W(hdrPinPos(I.scl.label), H(cc+2,6), wc(c,"scl")); W(hdrPinPos(I.sda.label), H(cc+3,6), wc(c,"sda"));
    } else if(COMP[c.type].place==="vehicle"){
      buildVehicle(c, {W, boardPin, bench, V});
    } else if(XC[c.type]){
      if(buildXModule(c, XC[c.type], {W, boardPin, wc, bench, V})) usesBottom = true;
    }
    bench.userData.comps[c.id] = V;
    if(V.g && COMP[c.type].place!=="vehicle") bench.userData.moves.push({obj:V.g, comp:c, kind: COMP[c.type].place==="front" ? "movefront" : "move"});
  });
  bench.userData.hits.push(...bench.userData.moves);
  if(usesBottom){
    if(S.rails){
      bench.add(flatJumper(RL("top","-",S.cols-1), RL("bot","-",S.cols-1), "#1d1d20"));
      bench.add(flatJumper(RL("top","+",S.cols-2), RL("bot","+",S.cols-2), "#d3271f"));
    } else {
      bench.add(flatJumper(H(S.cols-1,4), H(S.cols-1,5), "#1d1d20"));
      bench.add(flatJumper(H(S.cols-2,4), H(S.cols-2,5), "#d3271f"));
    }
  }
  bench.traverse(o => { if(o.isMesh && !o.isInstancedMesh && !o.material.transparent && o.material.visible!==false){ o.castShadow = true; o.receiveShadow = true; } });
  bench.visible = activeTab==="lab";
  syncArena(); syncViewsBar();
}
